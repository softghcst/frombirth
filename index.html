<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pathways</title>
  <meta name="description" content="Pathways: a text life simulation. One year at a time.">
  <meta name="theme-color" content="#F1EBFA">
  <script>
    // Appearance chosen in Settings (js/theme.js), applied before the first paint so there is no flash.
    try { var t = localStorage.getItem('pathways.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#231C2D' : '#F1EBFA'); } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pathways">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Great+Vibes&family=Pacifico&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/modals.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <noscript>Pathways needs JavaScript to run.</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
